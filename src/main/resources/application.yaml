spring:
  application:
    name: cep-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cepdb}
    username: ${DB_USER:cepuser}
    password: ${DB_PASSWORD:ceppassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${APP_PORT:8080}
  error:
    include-message: always

cep:
  api:
    base-url: ${CEP_API_URL:http://localhost:8089}
    timeout-seconds: 5

logging:
  level:
    com.cepapi: DEBUG
    org.springframework.web: INFO
